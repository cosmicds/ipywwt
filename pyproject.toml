[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipywwt"
version = "0.0.0"
dependencies = ["anywidget", "toasty", "matplotlib", "astropy", "pywwt>=0.26.0"]
readme = "README.md"
requires-python = ">=3.13"

# For projects not using `uv`, you can install these development dependencies with:
# `pip install -e ".[dev]"`
# If you're using `uv` for development, feel free to remove this section.
[project.optional-dependencies]
dev = ["watchfiles", "jupyterlab"]

# Dependency groups (recognized by `uv`). For more details, visit:
# https://peps.python.org/pep-0735/
[dependency-groups]
dev = [
    "watchfiles",
    "jupyterlab",
    "black>=26.1.0",
]


[tool.hatch.build]
only-packages = true
artifacts = ["src/ipywwt/static/*", "src/ipywwt/web_static/*"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/ipywwt/static/widget.js"]
skip-if-exists = ["src/ipywwt/static/widget.js"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "npm"
build_cmd = "build"
